name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:contracts
      - name: Biome
        run: pnpm exec biome ci .
      - name: Compose aponta a API para as leis de dentro da imagem
        run: |
          docker compose config | grep -q 'LAWS_DIR: /app/data/laws'
      - name: Typecheck
        run: pnpm typecheck
      - name: Testes unitários (api, web, contracts)
        run: pnpm test
      - name: Testes de integração (Postgres real via Testcontainers)
        run: pnpm test:int
